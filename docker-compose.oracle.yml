# Full stack on one Oracle free VM: Postgres + Sanchiva (UI + API)
# Usage on the VM:
#   docker compose -f docker-compose.oracle.yml up -d --build
#
# App listens on host 127.0.0.1:5000 only (not public 80).
# Put Caddy on 80/443 → reverse_proxy 127.0.0.1:5000 for HTTPS.
# See docs/ORACLE_HTTPS.md

services:
  db:
    image: postgres:16-alpine
    container_name: sanchiva-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sanchiva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sanchiva}
    volumes:
      - sanchiva_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sanchiva} -d ${POSTGRES_DB:-sanchiva}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not exposed publicly — only app talks to db on internal network
    networks:
      - sanchiva

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sanchiva-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-sanchiva}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sanchiva}
      PGSSL: "false"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
      # Long-lived sessions until user logs out (Google / guest / email)
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-30d}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-3650}
      JWT_ACCESS_SECONDS: ${JWT_ACCESS_SECONDS:-2592000}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-*}
      APP_URL: ${APP_URL:-http://localhost}
      API_URL: ${API_URL:-http://localhost}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Email OTP (signup + password reset) via Resend
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-Sanchiva <onboarding@resend.dev>}
      PASSWORD_RESET_FROM: ${PASSWORD_RESET_FROM:-}
      SIGNUP_OTP_FROM: ${SIGNUP_OTP_FROM:-}
    # Localhost only so Caddy (or host) owns public 80/443
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - sanchiva

volumes:
  sanchiva_pgdata:

networks:
  sanchiva:
    driver: bridge
