    <linearGradient id="s-inner" x1="36" y1="92" x2="92" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="40%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="s-highlight" x1="40" y1="30" x2="88" y2="70" gradientUnits="userSpaceOnUse">
