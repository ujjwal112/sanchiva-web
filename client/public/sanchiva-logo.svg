      <feOffset dy="0.6" result="o"/>
      <feColorMatrix in="o" type="matrix" values="0 0 0 0 0.05  0 0 0 0 0.2  0 0 0 0 0.55  0 0 0 0.28 0" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

