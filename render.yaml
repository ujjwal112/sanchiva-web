# Render Blueprint — web service only (Postgres on Neon)
# https://render.com/docs/blueprint-spec
#
# Set DATABASE_URL in the Render dashboard to your Neon pooled URL:
#   postgresql://...?sslmode=require
# Do not commit real secrets into this file.

services:
  - type: web
    name: sanchiva
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --prefix server && npm install --prefix client --include=dev && npm run build --prefix client
    startCommand: npm run db:init --prefix server && npm start --prefix server
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      # Neon (or any Postgres). Set the value in Render Dashboard → Environment.
      # sync: false keeps dashboard value from being overwritten by the blueprint.
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_ORIGIN
        value: "*"
      - key: PGSSL
        value: "true"
